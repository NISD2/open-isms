name: E2E

on:
  pull_request:
    branches: [main]

# Superseded runs are cancelled. Pushing three times to a PR used to run three
# full suites to completion; only the newest tells you anything.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # L0 schema-drift and coverage unit tests: seconds, no browser, no
      # docker — fail fast before the expensive browser suite.
      - run: bun run test:l0

      - run: bunx playwright install --with-deps chromium

      # e2e/start-server.sh brings up the docker stack (postgres + MinIO),
      # migrates via scripts/runtime-migrate.mjs, seeds, builds and serves.
      # No secrets: the whole stack is throwaway localhost dummies.
      - run: bun run e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
