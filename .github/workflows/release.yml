name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write  # npm provenance via GitHub OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'NISD2/open-isms'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required for npm provenance attestation

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package versions
        run: bun scripts/check-versions.ts "${GITHUB_REF#refs/tags/v}"

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Publish all packages
        run: bun scripts/publish-all.ts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
