name: Release

# Merging to main is the release. There is no tag to push, no version to bump,
# and nothing to run locally: the workflow works out the next version, builds
# it, proves it can be installed and upgraded into, and only then moves the
# tag everyone pulls.
#
# npm publishing deliberately lives in publish-npm.yml. It used to gate this
# pipeline, which meant a registry nobody had configured could hold `stable`
# hostage over a version mismatch in a package no self-hoster installs.
on:
  push:
    branches: [main]
    # Docs cannot change what the image does, and a release costs two native
    # builds plus a full upgrade gate.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # Builds both architectures and publishes nothing. Use it to check a change
  # to this file before merging it.
  workflow_dispatch:

permissions:
  contents: read

# Serialised, never cancelled. Two merges landing together would otherwise
# both read the same "latest tag" and compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nisd2/open-isms

jobs:
  # The next patch after the newest released tag. Tags are written at the end
  # of a successful run, so "newest tag" means "newest version that actually
  # passed the gate", and a failed run never consumes a number.
  version:
    if: github.repository == 'NISD2/open-isms'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: next
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "${latest}" ]; then
            next="0.1.0"
          else
            current="${latest#v}"
            major="${current%%.*}"
            rest="${current#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing ${next} (previous: ${latest:-none})."

  # Each architecture builds on its own native runner and pushes an untagged
  # image identified only by digest. Emulating arm64 through QEMU would take
  # this build well past any reasonable timeout, so the two run side by side
  # and are joined in `manifest`.
  image:
    if: github.repository == 'NISD2/open-isms'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          # An SBOM and full provenance travel with the image. We sell supply
          # chain compliance and teach the CRA's SBOM obligations; shipping
          # binaries whose contents nobody can enumerate would be hard to
          # defend. Both survive the merge below: imagetools copies each
          # architecture's attestation manifest alongside its image and keeps
          # the cross-reference.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest output carries its `sha256:` prefix and the merge step
      # re-applies it, so it comes off here. Left on, the reference becomes
      # `@sha256:sha256:...`, which buildx rejects at parse time.
      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture digests into one multi-arch manifest and gives
  # it its version tags. `stable` is deliberately NOT set here: it moves only
  # after the gate below, so a release that cannot be upgraded into never
  # becomes the version new self-hosters pull.
  manifest:
    if: github.repository == 'NISD2/open-isms' && github.event_name == 'push'
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          version="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" \
            -t "${IMAGE}:${version%.*}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Read manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ needs.version.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Signs the manifest with the workflow's own identity, so anyone pulling
      # can verify this image was built by this repository at this commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # Proves the release can actually be installed and upgraded into before it
  # becomes `stable`.
  #
  # What this catches: migrations that fail from scratch, migrations that fail
  # on top of the previous release's schema, and an image that does not boot.
  # That is the whole class of "the update bricked my instance" failures we can
  # test without customer data.
  #
  # What it does NOT catch: a migration that is valid against the empty schema
  # here but violates a constraint on somebody's real data, and code-level
  # backward incompatibility beyond the schema. Both are covered by policy,
  # see docs/migration-policy.md.
  upgrade-gate:
    if: github.repository == 'NISD2/open-isms' && github.event_name == 'push'
    needs: [version, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gate
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: gate
        options: >-
          --health-cmd "pg_isready -U gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DB: postgres://gate:gate@localhost:5432/gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # First, and before any login: every other step here authenticates, so
      # this is the only one that exercises the path a self-hoster's docker
      # actually takes. A GHCR package is private when first created.
      - name: The published image is pullable without credentials
        run: bash scripts/ci/assert-public-pull.sh "${IMAGE}" "${VERSION}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the previous release
        id: previous
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | head -1)
          # Git tags carry the leading v, image tags never do.
          echo "tag=${previous#v}" >> "$GITHUB_OUTPUT"
          if [ -z "${previous}" ]; then
            echo "::notice::No earlier release exists — testing a fresh install only."
          else
            echo "::notice::Testing upgrade from ${previous}."
          fi

      - name: Apply the previous release's migrations
        if: steps.previous.outputs.tag != ''
        run: |
          docker run --rm --network host -e DATABASE_URL="${DB}" \
            "${IMAGE}:${{ steps.previous.outputs.tag }}" \
            node /app/scripts/runtime-migrate.mjs

      - name: Apply this release's migrations
        run: |
          docker run --rm --network host -e DATABASE_URL="${DB}" \
            "${IMAGE}:${VERSION}" \
            node /app/scripts/runtime-migrate.mjs

      # Running the migrator twice must be a no-op. If it is not, the journal
      # and the bookkeeping table disagree and every restart would re-apply
      # something.
      - name: Migrations are idempotent
        run: |
          output=$(docker run --rm --network host -e DATABASE_URL="${DB}" \
            "${IMAGE}:${VERSION}" node /app/scripts/runtime-migrate.mjs 2>&1)
          echo "${output}"
          if echo "${output}" | grep -q "applied [1-9]"; then
            echo "::error::A second migrate run applied migrations. The chain is not idempotent."
            exit 1
          fi

      - name: The image boots and serves
        run: |
          docker run -d --name gate --network host \
            -e DATABASE_URL="${DB}" \
            -e AUTH_SECRET=gate_only_not_real_0123456789abcdef \
            -e AUTH_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -e ERASURE_EMAIL_HASH_SALT=gate_only \
            "${IMAGE}:${VERSION}"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              reported=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' /tmp/health.json)
              if [ "${reported}" != "${VERSION}" ]; then
                echo "::error::Image reports version '${reported}', expected '${VERSION}'. APP_VERSION was not stamped."
                docker logs gate; exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::The image never became healthy."
          docker logs gate
          exit 1

  # Last, and only after the gate. `stable` is what a self-hoster pulls when
  # they have not pinned a version, and the tag is the record of what passed:
  # written here rather than by a human beforehand, so a tag can never name a
  # version that failed.
  promote:
    if: github.repository == 'NISD2/open-isms' && github.event_name == 'push'
    needs: [version, manifest, upgrade-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move stable
        run: |
          docker buildx imagetools create -t "${IMAGE}:stable" "${IMAGE}:${VERSION}"
          echo "::notice::stable now points at ${VERSION}"

      - name: Stable is pullable without credentials
        run: bash scripts/ci/assert-public-pull.sh "${IMAGE}" stable

      # Creates the tag and the release together, from this commit. The notes
      # are generated from the merged PRs, which is what self-hosters read
      # before applying migrations to a compliance database.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
