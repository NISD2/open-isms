name: Gitleaks

# Scans the diff on every push and PR for secret patterns (API keys,
# tokens, private keys, connection strings). Audit EW-16 (2026-06-11).
# The local pre-commit hook half of EW-16 is deferred until husky is
# adopted; the Action half catches anything that reaches the remote.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan the whole tree on push
          # to main; PRs only scan the diff and don't need this depth.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
