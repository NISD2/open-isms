name: openisms-e2e

# Ephemeral local stack for the e2e suite. No volumes: `docker compose down`
# discards everything. Ports are non-default so a running dev stack survives.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: openisms_e2e
    healthcheck:
      # -h 127.0.0.1 is load-bearing. Without it pg_isready checks the unix
      # socket, and the postgres entrypoint runs a TEMPORARY server on that
      # socket while it initialises the database, with listen_addresses=''.
      # So the container reported healthy during init, the entrypoint then
      # stopped that server to start the real one, and the next command lost
      # the race: `docker compose up --wait` returned, start-server.sh ran its
      # wipe, and psql died on "socket /var/run/postgresql/.s.PGSQL.5432: No
      # such file or directory". Seen in CI on 03.09.2026. Checking TCP cannot
      # pass against the init server, so healthy now means the real one.
      test: ["CMD-SHELL", "pg_isready -U e2e -d openisms_e2e -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Static single-key KMS so MinIO accepts the x-amz-server-side-encryption
      # AES256 header the evidence upload always sends (SSE-S3 needs KMS in
      # MinIO). Keeps the client byte-identical with production S3. The base64
      # value is computed by e2e/start-server.sh (a committed blob trips
      # gitleaks; the key is a public localhost dummy either way).
      MINIO_KMS_SECRET_KEY: "e2e-key:${E2E_MINIO_KMS_B64:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
