name: openisms-e2e

# Ephemeral local stack for the e2e suite. No volumes: `docker compose down`
# discards everything. Ports are non-default so a running dev stack survives.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: openisms_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d openisms_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Static single-key KMS so MinIO accepts the x-amz-server-side-encryption
      # AES256 header the evidence upload always sends (SSE-S3 needs KMS in
      # MinIO). Keeps the client byte-identical with production S3.
      MINIO_KMS_SECRET_KEY: "e2e-key:ZTJlLW1pbmlvLWttcy0wMTIzNDU2Nzg5YWJjZGVmISE="
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
